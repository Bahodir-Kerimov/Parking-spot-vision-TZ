version: "3.9"
services:
  api:
    build: ./infra/api
    env_file: .env
    depends_on: [db, redis]
    ports: ["8000:8000"]
  web:
    build: ./infra/web
    env_file: .env
    depends_on: [api]
    ports: ["8080:8080"]
  detector:
    build: ./infra/detector
    env_file: .env
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: parking
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata: {{}}
